<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUB Assessment Generator</title>
  <style>
    /* Dark iOS Theme Styling */
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2c2c2e;
    }
    .btn {
      background-color: #0a84ff;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0071e3;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .grid-btn {
      background: #2c2c2e;
      color: #fff;
      padding: 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      text-align: center;
    }
    .grid-btn:hover {
      background: #3a3a3c;
    }
    .hidden {
      display: none;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 14px;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
      color: #fff;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>QUB Assessment Generator</h1>

    <!-- Country Selection Grid -->
    <div id="country-selection-view" class="card">
      <h2>Select Country</h2>
      <h3>Non-EU Countries</h3>
      <div id="non-eu-grid" class="grid"></div>
    </div>

    <!-- Custom Country Form (Shared for India & Iran) -->
    <div id="custom-form-view" class="card hidden">
      <button class="btn" onclick="showCountrySelection()">← Back to Selection</button>
      <h2 id="custom-form-title">Assessment Form</h2>
      
      <form id="assessment-form">
        <label for="student-name">Student Name</label>
        <input type="text" id="student-name" placeholder="Enter student name" />

        <label for="academic-qualification">Academic Qualification / Institution</label>
        <input type="text" id="academic-qualification" placeholder="Enter degree/institution details" />

        <label for="grades">Grades / Percentage</label>
        <input type="text" id="grades" placeholder="e.g., 70% or GPA 3.5" />

        <label for="assessment-notes">Generated Notes</label>
        <textarea id="assessment-notes" rows="5" readonly></textarea>

        <button type="button" class="btn" onclick="generateNotes()">Generate Notes</button>
        <button type="button" class="btn" style="background-color: #30d158;" onclick="copyNotes()">Copy Notes</button>
      </form>
    </div>

    <!-- Default Country View (For standard countries) -->
    <div id="default-view" class="card hidden">
      <button class="btn" onclick="showCountrySelection()">← Back to Selection</button>
      <h2 id="default-country-title">Standard Assessment View</h2>
      <p>Standard comparability note generator view.</p>
    </div>
  </div>

  <script>
    // Country Lists Configuration
    var EU = [];
    var NON_EU = ["India", "Pakistan", "Bangladesh", "Iran"]; // Added Iran

    // Register custom country forms (India & Iran both use the custom form layout)
    var CUSTOM_COUNTRY_FORMS = {
      "India": true,
      "Iran": true
    };

    var currentSelectedCountry = "";

    // Render Country Grid
    function renderGrid() {
      var gridContainer = document.getElementById("non-eu-grid");
      gridContainer.innerHTML = "";

      NON_EU.forEach(function(country) {
        var btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.innerText = country;
        btn.onclick = function() { selectCountry(country); };
        gridContainer.appendChild(btn);
      });
    }

    // Handle Country Routing
    function selectCountry(country) {
      currentSelectedCountry = country;
      document.getElementById("country-selection-view").classList.add("hidden");

      if (CUSTOM_COUNTRY_FORMS[country]) {
        // Render custom country form view for India & Iran
        document.getElementById("custom-form-title").innerText = country + " Assessment Form";
        document.getElementById("custom-form-view").classList.remove("hidden");
        document.getElementById("default-view").classList.add("hidden");
      } else {
        // Render default view for other countries[cite: 1]
        document.getElementById("default-country-title").innerText = country + " Assessment View";
        document.getElementById("default-view").classList.remove("hidden");
        document.getElementById("custom-form-view").classList.add("hidden");
      }
    }

    function showCountrySelection() {
      document.getElementById("country-selection-view").classList.remove("hidden");
      document.getElementById("custom-form-view").classList.add("hidden");
      document.getElementById("default-view").classList.add("hidden");
    }

    function generateNotes() {
      var name = document.getElementById("student-name").value;
      var qual = document.getElementById("academic-qualification").value;
      var grades = document.getElementById("grades").value;

      var output = "Country: " + currentSelectedCountry + "\n" +
                     "Student: " + name + "\n" +
                     "Qualification: " + qual + "\n" +
                     "Grades: " + grades;

      document.getElementById("assessment-notes").value = output;
    }

    function copyNotes() {
      var notes = document.getElementById("assessment-notes");
      notes.select();
      navigator.clipboard.writeText(notes.value);
      alert("Notes copied to clipboard!");
    }

    // Initialize grid on load
    renderGrid();
  </script>
</body>
</html>
